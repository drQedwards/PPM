name: restore-readme

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-readme.yml"
      - ".github/scripts/restore-ppm-readme.py"

permissions:
  contents: write

concurrency:
  group: restore-readme
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore README from adc8210 and add live Stellar IDs
        env:
          GOOD_SHA: adc8210109ad5af794f4ac325cea918dd5c40628
        run: |
          set -euo pipefail
          git show "${GOOD_SHA}:README.md" > README.md
          python3 .github/scripts/restore-ppm-readme.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/restore-readme.yml
          git rm -f .github/scripts/restore-ppm-readme.py
          git add README.md
          git commit -m "Restore full README and document live pmll-anchor IDs"
          git push origin HEAD:main
